<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>वाणी Vaani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Albert+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161f;
    --ink-raised: #1c1f2b;
    --chalk: #e9e6dc;
    --slate: #7a8095;
    --marigold: #f2b234;
    --marigold-deep: #c8871c;
    --line: #2a2e3d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--chalk);
    font-family: "Albert Sans", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 8px;
  }
  .wordmark {
    font-family: "Tiro Devanagari Hindi", serif;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
  }
  .wordmark .latin { color: var(--slate); font-size: 1rem; margin-left: 6px; }
  .corpus-tag {
    font-family: "Spline Sans Mono", monospace;
    font-size: 0.7rem;
    color: var(--slate);
  }
  main { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 20px; }

  .stage-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 0 8px;
  }
  #mic {
    width: 92px; height: 92px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--ink-raised);
    color: var(--marigold);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  #mic:hover { border-color: var(--marigold-deep); }
  #mic:focus-visible { outline: 2px solid var(--marigold); outline-offset: 3px; }
  #mic.recording { border-color: var(--marigold); transform: scale(1.06); }
  #mic svg { width: 34px; height: 34px; }
  .hint {
    color: var(--slate);
    font-size: 0.85rem;
    min-height: 1.2em;
  }

  /* one canvas, two lives: voice bars while recording, latency bars after */
  #bars {
    width: 100%;
    max-width: 560px;
    height: 96px;
    display: block;
  }
  .bars-legend {
    width: 100%;
    max-width: 560px;
    display: none;
    justify-content: space-between;
    font-family: "Spline Sans Mono", monospace;
    font-size: 0.68rem;
    color: var(--slate);
  }
  .bars-legend.visible { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .bars-legend b { color: var(--chalk); font-weight: 500; }

  .transcript {
    min-height: 1.4em;
    text-align: center;
    font-size: 1.05rem;
  }
  .transcript.partial { color: var(--slate); font-style: italic; }

  .answer-card {
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .answer-card.visible { display: flex; }
  .answer-card .eyebrow {
    font-family: "Spline Sans Mono", monospace;
    font-size: 0.68rem;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .answer-card.refused .eyebrow { color: var(--marigold); }
  .answer-text { font-size: 1.08rem; line-height: 1.55; }
  .sources { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: "Spline Sans Mono", monospace;
    font-size: 0.65rem;
    color: var(--marigold);
    border: 1px solid var(--marigold-deep);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .total-line {
    font-family: "Spline Sans Mono", monospace;
    font-size: 0.8rem;
    color: var(--slate);
  }
  .total-line b { color: var(--marigold); font-weight: 500; }

  .text-mode {
    display: flex;
    gap: 8px;
    opacity: 0.75;
  }
  .text-mode input {
    flex: 1;
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--chalk);
    padding: 10px 12px;
    font: inherit;
  }
  .text-mode input:focus-visible { outline: 2px solid var(--marigold); outline-offset: 1px; }
  .text-mode button {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--slate);
    padding: 10px 14px;
    font: inherit;
    cursor: pointer;
  }
  .text-mode button:hover { color: var(--chalk); border-color: var(--slate); }
  footer {
    margin-top: auto;
    padding-top: 32px;
    font-size: 0.72rem;
    color: var(--slate);
  }
  @media (prefers-reduced-motion: reduce) {
    #mic { transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">वाणी<span class="latin">vaani</span></div>
  <div class="corpus-tag">MSMARCO-XI · hindi + english</div>
</header>

<main>
  <div class="stage-area">
    <button id="mic" aria-label="Hold a question: tap, speak, tap again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v3"/>
      </svg>
    </button>
    <div class="hint" id="hint">Tap the mic, ask in Hindi or English, tap again to finish</div>
    <canvas id="bars" width="560" height="96" aria-hidden="true"></canvas>
    <div class="bars-legend" id="legend"></div>
  </div>

  <div class="transcript" id="transcript"></div>

  <div class="answer-card" id="card">
    <div class="eyebrow" id="eyebrow">answer</div>
    <div class="answer-text" id="answerText"></div>
    <div class="sources" id="sources"></div>
    <div class="total-line" id="totalLine"></div>
  </div>

  <form class="text-mode" id="textForm">
    <input id="textInput" type="text" placeholder="Or type a question to test without voice"
           autocomplete="off">
    <button type="submit">Ask</button>
  </form>
</main>

<footer>answers come only from the corpus; when nothing relevant exists, vaani says so</footer>

<script>
const mic = document.getElementById("mic");
const hint = document.getElementById("hint");
const barsCanvas = document.getElementById("bars");
const legend = document.getElementById("legend");
const transcriptEl = document.getElementById("transcript");
const card = document.getElementById("card");
const eyebrow = document.getElementById("eyebrow");
const answerText = document.getElementById("answerText");
const sourcesEl = document.getElementById("sources");
const totalLine = document.getElementById("totalLine");
const ctx = barsCanvas.getContext("2d");

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// voice routes can be gated by an access key handed out with the link
const ACCESS_KEY = new URLSearchParams(location.search).get("key");

let recorder = null, chunks = [], audioCtx = null, analyser = null, rafId = null;
let wsMode = true;   // streaming first; drops to clip mode if the server declines
let session = null;  // live streaming session, null otherwise
let streamBuf = "";

// ---- live voice bars ------------------------------------------------
function drawVoiceBars() {
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const w = barsCanvas.width, h = barsCanvas.height, n = 48, gap = 3;
  const bw = (w - gap * (n - 1)) / n;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = css("--marigold");
  for (let i = 0; i < n; i++) {
    const v = data[Math.floor(i * data.length / n)] / 255;
    const bh = Math.max(3, v * h * 0.9);
    ctx.globalAlpha = 0.35 + v * 0.65;
    ctx.fillRect(i * (bw + gap), h - bh, bw, bh);
  }
  ctx.globalAlpha = 1;
  rafId = requestAnimationFrame(drawVoiceBars);
}

// ---- latency waterfall on the same canvas ---------------------------
function drawLatency(trace) {
  cancelAnimationFrame(rafId);
  const w = barsCanvas.width, h = barsCanvas.height;
  const shown = trace.filter(s => s.ms >= 0.05 || s.stage === "stt");
  const total = shown.reduce((a, s) => a + s.ms, 0) || 1;
  const gap = 4;
  ctx.clearRect(0, 0, w, h);
  legend.innerHTML = "";
  let x = 0;
  const maxMs = Math.max(...shown.map(s => s.ms));
  shown.forEach((s, i) => {
    const bw = Math.max(26, (s.ms / total) * (w - gap * (shown.length - 1)));
    const bh = Math.max(8, (s.ms / maxMs) * h * 0.85);
    const t = i / Math.max(1, shown.length - 1);
    ctx.fillStyle = t < 0.5 ? css("--marigold") : css("--marigold-deep");
    ctx.globalAlpha = 0.9 - t * 0.35;
    ctx.fillRect(x, h - bh, bw, bh);
    x += bw + gap;
    const item = document.createElement("span");
    item.innerHTML = `${s.stage} <b>${s.ms.toFixed(1)}ms</b>`;
    legend.appendChild(item);
  });
  ctx.globalAlpha = 1;
  legend.classList.add("visible");
}

// ---- render a pipeline response ------------------------------------
function render(data) {
  card.classList.add("visible");
  sourcesEl.innerHTML = "";
  if (data.transcript !== undefined) {
    transcriptEl.textContent = data.transcript || "";
    transcriptEl.classList.remove("partial");
  }
  if (data.refused) {
    card.classList.add("refused");
    eyebrow.textContent = "no answer · " + (data.refusal.reason_code || "refused");
    answerText.textContent = friendlyRefusal(data.refusal);
  } else {
    card.classList.remove("refused");
    eyebrow.textContent = "answer · " + data.answer.kind;
    answerText.textContent = data.answer.text;
    (data.answer.passage_ids || []).forEach(pid => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = pid.slice(0, 8);
      sourcesEl.appendChild(chip);
    });
  }
  totalLine.innerHTML =
    `pipeline <b>${data.pipeline_ms}ms</b>` +
    (data.trace.some(s => s.stage === "stt")
      ? ` · with speech <b>${data.total_ms}ms</b>` : "");
  drawLatency(data.trace);
}

function friendlyRefusal(refusal) {
  const reasons = {
    low_confidence: "The corpus has nothing close enough to answer this. Try a factual question the web would cover.",
    empty_transcript: "Couldn't hear a question. Tap the mic and try again.",
    unsafe_input: "That question isn't something this system will answer.",
  };
  return reasons[refusal.reason_code] || (refusal.message || "No answer this time.");
}

async function post(url, body, isForm) {
  hint.textContent = "thinking…";
  const headers = ACCESS_KEY ? { "X-Vaani-Key": ACCESS_KEY } : {};
  try {
    const res = await fetch(url, isForm
      ? { method: "POST", headers, body }
      : { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    render(data);
    hint.textContent = "Tap the mic to ask another";
  } catch {
    hint.textContent = "Server unreachable. Is the backend running?";
  }
}

// ---- streaming voice over the websocket -----------------------------
// mic audio runs through an AudioWorklet, gets resampled to mono 16kHz
// PCM16 and streams to /ws/voice; partials, tokens and the result come
// back as JSON events. Tokens are provisional: the result event is the
// authoritative answer and replaces whatever was typed out.
const WORKLET_SRC = `
class PCMForwarder extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = []; this.len = 0;
    this.port.onmessage = () => this.flush();
  }
  flush() {
    if (!this.len) return;
    const all = new Float32Array(this.len);
    let o = 0;
    for (const b of this.buf) { all.set(b, o); o += b.length; }
    this.buf = []; this.len = 0;
    this.port.postMessage(all, [all.buffer]);
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) {
      this.buf.push(new Float32Array(ch));
      this.len += ch.length;
      if (this.len >= 4096) this.flush();
    }
    return true;
  }
}
registerProcessor("pcm-forwarder", PCMForwarder);
`;

function toPCM16(float32, fromRate) {
  const ratio = fromRate / 16000;
  const n = Math.floor(float32.length / ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const idx = i * ratio;
    const lo = Math.floor(idx);
    const hi = Math.min(lo + 1, float32.length - 1);
    const s = float32[lo] + (float32[hi] - float32[lo]) * (idx - lo);
    out[i] = Math.max(-1, Math.min(1, s)) * 0x7fff;
  }
  return out;
}

function showToken(delta) {
  streamBuf += delta;
  card.classList.add("visible");
  card.classList.remove("refused");
  eyebrow.textContent = "answer · live";
  answerText.textContent = streamBuf;
}

async function startStreaming(stream, onUnavailable) {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const keyQuery = ACCESS_KEY ? `?key=${encodeURIComponent(ACCESS_KEY)}` : "";
  const ws = new WebSocket(`${scheme}://${location.host}/ws/voice${keyQuery}`);
  ws.binaryType = "arraybuffer";
  await new Promise((ok, no) => { ws.onopen = ok; ws.onerror = no; });

  const workletUrl = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "text/javascript" }));
  await audioCtx.audioWorklet.addModule(workletUrl);
  const node = new AudioWorkletNode(audioCtx, "pcm-forwarder");
  const sampleRate = audioCtx.sampleRate;
  node.port.onmessage = e => {
    if (ws.readyState === WebSocket.OPEN) ws.send(toPCM16(e.data, sampleRate).buffer);
  };
  audioCtx.createMediaStreamSource(stream).connect(node);

  streamBuf = "";
  let gotResult = false;
  let stopped = false;
  let finished = false;

  // idempotent: runs once no matter which path gets here first, so the
  // mic never stays hot after a result, an error or a dropped socket
  const finish = () => {
    if (finished) return;
    finished = true;
    node.disconnect();
    stream.getTracks().forEach(t => t.stop());
    audioCtx.close();
    mic.classList.remove("recording");
    cancelAnimationFrame(rafId);
  };

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "partial") {
      transcriptEl.textContent = msg.text;
      transcriptEl.classList.add("partial");
    } else if (msg.type === "transcript") {
      transcriptEl.textContent = msg.text;
      transcriptEl.classList.remove("partial");
      hint.textContent = "thinking…";
    } else if (msg.type === "token") {
      showToken(msg.text);
    } else if (msg.type === "result") {
      gotResult = true;
      streamBuf = "";
      finish();
      render(msg);
      hint.textContent = "Tap the mic to ask another";
      ws.close();
      session = null;
    } else if (msg.type === "error") {
      wsMode = false;
      finish();
      ws.close();
      session = null;
      onUnavailable();
    }
  };
  ws.onclose = () => {
    finish();
    session = null;
    if (!gotResult && wsMode && stopped) hint.textContent = "Tap the mic to try again";
  };

  return {
    stop() {
      stopped = true;
      // let the worklet flush its partial tail through the still-open
      // socket before the tracks die, then clean up
      node.port.postMessage("flush");
      setTimeout(finish, 150);
      hint.textContent = "waiting for the answer…";
      // keep the socket: the final transcript and result are still coming
      setTimeout(() => { if (!gotResult) { ws.close(); session = null; } }, 8000);
    },
  };
}

// ---- clip fallback: record webm, post the finished clip -------------
function startClip(stream) {
  chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    audioCtx.close();
    mic.classList.remove("recording");
    cancelAnimationFrame(rafId);
    const blob = new Blob(chunks, { type: "audio/webm" });
    const form = new FormData();
    form.append("file", blob, "question.webm");
    transcriptEl.textContent = "…";
    transcriptEl.classList.add("partial");
    post("/api/voice", form, true);
  };
  recorder.start();
}

// ---- mic flow -------------------------------------------------------
async function startCapture() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  mic.classList.add("recording");
  hint.textContent = "Listening… tap again when done";
  if (!reduceMotion) drawVoiceBars();

  if (wsMode && window.AudioWorkletNode) {
    try {
      // if the server has no realtime stt it answers instantly, before
      // any speech, so redoing the capture in clip mode goes unnoticed
      session = await startStreaming(stream, () => { startCapture().catch(() => {}); });
      return;
    } catch {
      wsMode = false;
    }
  }
  startClip(stream);
}

mic.addEventListener("click", async () => {
  if (session) { session.stop(); return; }
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    await startCapture();
  } catch {
    hint.textContent = "Microphone permission needed; or use the text box below";
  }
});

// ---- text fallback --------------------------------------------------
document.getElementById("textForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("textInput").value.trim();
  if (!q) return;
  transcriptEl.textContent = q;
  transcriptEl.classList.remove("partial");
  post("/api/ask", { query: q }, false);
});
</script>
</body>
</html>

[project]
name = "vaani"
description = "Voice-enabled RAG over MSMARCO-XI with a sub-200ms answer path"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.10",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.27.0",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.7.0",
    "torch>=2.7",
    "usearch>=2.26.0",
    "uvicorn>=0.52.3",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs local indexes or models"]
